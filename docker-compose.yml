services:
  backend:
    image: mcr.microsoft.com/devcontainers/python:3.12-bookworm
    working_dir: /workspaces/MedVisit
    volumes:
      - .:/workspaces/MedVisit:cached
    # devcontainer postCreateCommand only runs in the attached service
    # (frontend), so install backend deps here on container start to keep
    # parity with the frontend's automatic `npm ci`.
    command: bash -c "pip install --user -r backend/twelvelabs/requirements.txt && sleep infinity"
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:8080

  frontend:
    image: mcr.microsoft.com/devcontainers/typescript-node:22-bookworm
    working_dir: /workspaces/MedVisit
    volumes:
      - .:/workspaces/MedVisit:cached
    command: sleep infinity
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
